name: Firebase Internal Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes; defaults to the latest commit message."
        required: false
        type: string
  push:
    tags:
      - beta-*

concurrency:
  group: internal-distribution-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firebase-internal-distribution:
    name: Signed release to Firebase testers
    runs-on: ubuntu-latest
    environment: firebase-internal
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2

    defaults:
      run:
        working-directory: androidApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate required secrets
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          RELEASE_STORE_BASE64: ${{ secrets.FOLENTRA_RELEASE_STORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.FOLENTRA_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.FOLENTRA_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.FOLENTRA_RELEASE_KEY_PASSWORD }}
        run: |
          echo "::add-mask::$FIREBASE_APP_ID"
          echo "::add-mask::$FIREBASE_TESTER_GROUPS"
          missing=0
          for name in \
            FIREBASE_APP_ID \
            FIREBASE_GOOGLE_SERVICES_JSON \
            FIREBASE_SERVICE_ACCOUNT_JSON \
            FIREBASE_TESTER_GROUPS \
            RELEASE_STORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is required for signed internal distribution."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Firebase Android clients
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          config_file="$GITHUB_WORKSPACE/androidApp/app/google-services.json"
          umask 077
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > "$config_file"
          python "$GITHUB_WORKSPACE/scripts/validate_firebase_config.py" \
            "$config_file" \
            --package com.mojtaba.folentra \
            --package com.mojtaba.folentra.debug \
            --release-app-id "$FIREBASE_APP_ID"

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_STORE_BASE64: ${{ secrets.FOLENTRA_RELEASE_STORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.FOLENTRA_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.FOLENTRA_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.FOLENTRA_RELEASE_KEY_PASSWORD }}
        run: |
          signing_dir="$RUNNER_TEMP/folentra-signing"
          signing_store="$signing_dir/release.keystore"
          mkdir -p "$signing_dir"
          umask 077
          printf '%s' "$RELEASE_STORE_BASE64" | base64 --decode > "$signing_store"
          {
            echo "ORG_GRADLE_PROJECT_FOLENTRA_RELEASE_STORE_FILE=$signing_store"
            echo "ORG_GRADLE_PROJECT_FOLENTRA_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_FOLENTRA_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_FOLENTRA_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "ORG_GRADLE_PROJECT_FOLENTRA_REQUIRE_RELEASE_SIGNING=true"
          } >> "$GITHUB_ENV"

      - name: Configure Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          python -m json.tool "$credentials_file" > /dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Prepare distribution metadata
        id: metadata
        shell: bash
        env:
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes || '' }}
        run: |
          ref_name="${GITHUB_REF_NAME//\//-}"
          version_name="$(grep -E '^FOLENTRA_VERSION_NAME=' gradle.properties | head -n 1 | cut -d= -f2-)"
          version_code="$(grep -E '^FOLENTRA_VERSION_CODE=' gradle.properties | head -n 1 | cut -d= -f2-)"
          notes_file="$RUNNER_TEMP/folentra-internal-release-notes.txt"

          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9]+)*$ ]]; then
            echo "::error::FOLENTRA_VERSION_NAME has an invalid format."
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::FOLENTRA_VERSION_CODE has an invalid format."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "$RELEASE_NOTES_INPUT" ]]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > "$notes_file"
          else
            git log -1 --pretty=%B > "$notes_file"
          fi

          echo "artifact_suffix=${version_name}-${version_code}-${ref_name}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Validate Firebase config parser
        working-directory: .
        run: python -m unittest scripts/test_validate_firebase_config.py

      - name: Run release validation
        run: |
          ./gradlew \
            :app:validateFirebaseConfiguration \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :shared:allTests \
            :app:validateReleaseSigning \
            :app:assembleRelease \
            --console=plain

      - name: Verify signed APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}."
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "${apks[0]}" > "$RUNNER_TEMP/apksigner-report.txt"

      - name: Upload release APK and mapping
        uses: actions/upload-artifact@v4
        with:
          name: folentra-internal-release-${{ steps.metadata.outputs.artifact_suffix }}
          path: |
            androidApp/app/build/outputs/apk/release/*.apk
            androidApp/app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Distribute release APK
        id: distribute
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          firebase appdistribution:distribute "${apks[0]}" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes-file "${{ steps.metadata.outputs.release_notes_file }}"

      - name: Write distribution summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Firebase internal release"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${{ steps.metadata.outputs.version_name }}\` (\`${{ steps.metadata.outputs.version_code }}\`)"
            echo "- Variant: signed, minified \`release\`"
            echo "- Artifact: \`folentra-internal-release-${{ steps.metadata.outputs.artifact_suffix }}\`"
            echo "- Distribution result: \`${{ steps.distribute.outcome }}\`"
            echo ""
            echo "Firebase identifiers, tester groups, credentials, and release-note content are intentionally omitted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean credentials and Firebase config
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/androidApp/app/google-services.json"
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          if [[ -n "${ORG_GRADLE_PROJECT_FOLENTRA_RELEASE_STORE_FILE:-}" ]]; then
            rm -f "$ORG_GRADLE_PROJECT_FOLENTRA_RELEASE_STORE_FILE"
          fi
