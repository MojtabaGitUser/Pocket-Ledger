name: PR Validation

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-validation:
    name: Android validation
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2

    defaults:
      run:
        working-directory: androidApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: List Gradle projects
        run: ./gradlew projects

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Run JVM and shared tests
        run: ./gradlew testDebugUnitTest :shared:allTests

      - name: Assemble debug app
        run: ./gradlew :app:assembleDebug

      - name: Assemble release app
        run: ./gradlew :app:assembleRelease

      - name: Assemble benchmark artifacts
        run: ./gradlew :app:assembleBenchmark :macrobenchmark:assemble
